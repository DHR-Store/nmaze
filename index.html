<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Network Chat</title>
<style>
  :root{
    --bg:#0f1220; --panel:#171a2b; --panel-2:#1e2238; --line:#282d47;
    --text:#e8eaf6; --muted:#8b90b5; --accent:#5b8cff;
    --bubble-me:#3b6ef5; --bubble-other:#232842;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  #app{display:grid; grid-template-columns:260px 1fr; height:100vh}

  /* ---------- Sidebar ---------- */
  aside{
    background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  .brand{padding:18px 16px; border-bottom:1px solid var(--line)}
  .brand h1{margin:0; font-size:16px; letter-spacing:.3px}
  .brand small{color:var(--muted); font-size:11px}
  .side-title{
    padding:14px 16px 8px; font-size:11px; text-transform:uppercase;
    letter-spacing:1px; color:var(--muted);
  }
  #userList{list-style:none; margin:0; padding:0 8px 12px; overflow-y:auto; flex:1}
  #userList li{
    display:flex; align-items:center; gap:8px; padding:7px 10px;
    border-radius:8px; font-size:14px;
  }
  #userList li .dot{
    width:8px; height:8px; border-radius:50%; background:#3ddc84; flex:none;
    box-shadow:0 0 8px #3ddc84;
  }
  .side-foot{
    padding:12px 16px; border-top:1px solid var(--line);
    font-size:12px; color:var(--muted);
  }

  /* ---------- Main ---------- */
  main{display:flex; flex-direction:column; min-width:0; min-height:0}
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  header .title{font-weight:600}
  #status{
    display:flex; align-items:center; gap:7px;
    font-size:12px; color:var(--muted);
  }
  #status .dot{width:9px;height:9px;border-radius:50%;background:#888}
  #status.online .dot{background:#3ddc84; box-shadow:0 0 8px #3ddc84}
  #status.offline .dot{background:#ff5c5c; box-shadow:0 0 8px #ff5c5c}
  #status.connecting .dot{background:#ffb020}

  #messages{
    flex:1; overflow-y:auto; padding:18px;
    display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth;
  }
  .msg{max-width:min(72%,620px); display:flex; flex-direction:column; gap:4px}
  .msg .meta{font-size:11px; color:var(--muted); padding:0 4px}
  .msg .bubble{
    padding:9px 13px; border-radius:14px; font-size:14.5px; line-height:1.45;
    background:var(--bubble-other); word-wrap:break-word; white-space:pre-wrap;
    overflow-wrap:anywhere;
  }
  .msg.mine{align-self:flex-end; align-items:flex-end}
  .msg.mine .bubble{background:var(--bubble-me); border-bottom-right-radius:5px}
  .msg.other .bubble{border-bottom-left-radius:5px}

  .system{
    align-self:center; font-size:12px; color:var(--muted);
    background:var(--panel-2); padding:4px 12px; border-radius:20px;
  }

  /* ---------- Composer ---------- */
  form#composer{
    display:flex; gap:10px; padding:12px 16px;
    border-top:1px solid var(--line); background:var(--panel);
  }
  #input{
    flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:14.5px; outline:none;
  }
  #input:focus{border-color:var(--accent)}
  button{
    padding:12px 20px; border:0; border-radius:10px; cursor:pointer;
    background:var(--accent); color:#fff; font-size:14px; font-weight:600;
  }
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.5; cursor:not-allowed}

  /* ---------- Login ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(8,10,20,.92);
    display:flex; align-items:center; justify-content:center; z-index:10;
    backdrop-filter:blur(4px);
  }
  .overlay.hidden{display:none}
  .card{
    width:min(92vw,360px); background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:26px; display:flex; flex-direction:column; gap:14px;
  }
  .card h2{margin:0; font-size:19px}
  .card p{margin:0; color:var(--muted); font-size:13px}
  .card input{
    padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:15px; outline:none;
  }
  .card input:focus{border-color:var(--accent)}

  @media (max-width:720px){
    #app{grid-template-columns:1fr}
    aside{display:none}
    .msg{max-width:88%}
  }
</style>
</head>
<body>

<div id="app">
  <aside>
    <div class="brand">
      <h1>Network Chat</h1>
      <small id="hostLabel"></small>
    </div>
    <div class="side-title">Online — <span id="onlineCount">0</span></div>
    <ul id="userList"></ul>
    <div class="side-foot">Registered users: <span id="regCount">0</span></div>
  </aside>

  <main>
    <header>
      <div class="title"># general</div>
      <div id="status" class="connecting"><span class="dot"></span><span id="statusText">connecting…</span></div>
    </header>

    <div id="messages"></div>

    <form id="composer" autocomplete="off">
      <input id="input" placeholder="Type a message…" maxlength="2000" disabled />
      <button type="submit" id="sendBtn" disabled>Send</button>
    </form>
  </main>
</div>

<div id="login" class="overlay">
  <form class="card" id="loginForm">
    <h2>Join the chat</h2>
    <p>Pick a display name. It is stored on this device.</p>
    <input id="usernameInput" maxlength="24" placeholder="Your name" autocomplete="off" />
    <button type="submit">Enter</button>
  </form>
</div>

<script>
(() => {
  'use strict';

  /* ---------------- DOM ---------------- */
  const $ = (id) => document.getElementById(id);
  const els = {
    messages:   $('messages'),
    input:      $('input'),
    sendBtn:    $('sendBtn'),
    composer:   $('composer'),
    status:     $('status'),
    statusText: $('statusText'),
    userList:   $('userList'),
    onlineCount:$('onlineCount'),
    regCount:   $('regCount'),
    hostLabel:  $('hostLabel'),
    login:      $('login'),
    loginForm:  $('loginForm'),
    username:   $('usernameInput'),
  };

  /* ---------------- State ---------------- */
  const STORAGE_KEY = 'networkchat.username';
  let myName = localStorage.getItem(STORAGE_KEY) || '';
  let ws = null;
  let reconnectDelay = 1000;
  let reconnectTimer = null;
  let joined = false;

  els.hostLabel.textContent = location.host;

  /* ---------------- WebSocket ---------------- */
  function wsUrl() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    return `${proto}//${location.host}`;
  }

  function setStatus(state, text) {
    els.status.className = state;
    els.statusText.textContent = text;
  }

  function connect() {
    clearTimeout(reconnectTimer);
    setStatus('connecting', 'connecting…');

    try {
      ws = new WebSocket(wsUrl());
    } catch (e) {
      scheduleReconnect();
      return;
    }

    ws.addEventListener('open', () => {
      reconnectDelay = 1000;
      setStatus('online', 'online');
      enableComposer(true);
      if (myName) send({ type: 'join', username: myName });
    });

    ws.addEventListener('message', (ev) => {
      let data;
      try { data = JSON.parse(ev.data); } catch { return; }
      handle(data);
    });

    ws.addEventListener('close', () => {
      joined = false;
      setStatus('offline', 'reconnecting…');
      enableComposer(false);
      scheduleReconnect();
    });

    ws.addEventListener('error', () => {
      try { ws.close(); } catch (_) {}
    });
  }

  function scheduleReconnect() {
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.7, 15000);
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(obj));
      return true;
    }
    return false;
  }

  /* ---------------- Server messages ---------------- */
  function handle(data) {
    switch (data.type) {
      case 'history':
        els.messages.innerHTML = '';
        (data.messages || []).forEach(addChatMessage);
        scrollToBottom(true);
        break;

      case 'message':
        addChatMessage(data.message);
        scrollToBottom();
        break;

      case 'system':
        addSystem(data.text);
        scrollToBottom();
        break;

      case 'users':
        renderUsers(data.users || [], data.registered || 0);
        break;

      case 'error':
        addSystem('⚠ ' + data.text);
        break;
    }
  }

  /* ---------------- Rendering ---------------- */
  function addChatMessage(m) {
    if (!m) return;
    const mine = m.user === myName;
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (mine ? 'mine' : 'other');

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (mine ? 'You' : m.user) + ' · ' + fmtTime(m.ts);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = m.text;          // textContent => no XSS

    wrap.append(meta, bubble);
    els.messages.appendChild(wrap);
  }

  function addSystem(text) {
    const el = document.createElement('div');
    el.className = 'system';
    el.textContent = text;
    els.messages.appendChild(el);
  }

  function renderUsers(online, registered) {
    els.userList.innerHTML = '';
    online.sort((a, b) => a.localeCompare(b)).forEach((name) => {
      const li = document.createElement('li');
      const dot = document.createElement('span');
      dot.className = 'dot';
      const label = document.createElement('span');
      label.textContent = name + (name === myName ? ' (you)' : '');
      li.append(dot, label);
      els.userList.appendChild(li);
    });
    els.onlineCount.textContent = online.length;
    els.regCount.textContent = registered;
  }

  function fmtTime(ts) {
    const d = new Date(ts || Date.now());
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function scrollToBottom(force) {
    const box = els.messages;
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 160;
    if (force || nearBottom) box.scrollTop = box.scrollHeight;
  }

  function enableComposer(on) {
    els.input.disabled = !on;
    els.sendBtn.disabled = !on;
    if (on) els.input.focus();
  }

  /* ---------------- Composer ---------------- */
  els.composer.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = els.input.value.trim();
    if (!text) return;
    if (send({ type: 'message', text })) {
      els.input.value = '';
      els.input.focus();
    }
  });

  /* ---------------- Login ---------------- */
  els.loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = els.username.value.trim().replace(/\s+/g, ' ').slice(0, 24);
    if (!name) return;
    myName = name;
    localStorage.setItem(STORAGE_KEY, name);
    els.login.classList.add('hidden');
    if (ws && ws.readyState === WebSocket.OPEN) {
      send({ type: 'join', username: name });
    }
  });

  /* ---------------- Boot ---------------- */
  if (myName) {
    els.login.classList.add('hidden');
    els.username.value = myName;
  } else {
    els.username.focus();
  }
  connect();

  window.addEventListener('beforeunload', () => {
    try { ws && ws.close(); } catch (_) {}
  });
})();
</script>
</body>
</html>
